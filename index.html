<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="./marrafood-delivery">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marrakech Delights - Authentic Moroccan Cuisine Restaurant">
  <meta name="keywords" content="Moroccan food, Marrakech restaurant, traditional cuisine, halal food">
  <meta name="author" content="Sekouti Abdelaziz">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Marrakech Delights">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://marrakech-delights.com">
  <meta property="og:title" content="Marrakech Delights - Authentic Moroccan Cuisine">
  <meta property="og:description" content="Experience the authentic taste of Morocco with our traditional dishes. Order online for home delivery.">
  <meta property="og:image" content="https://marrakech-delights.com/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://marrakech-delights.com">
  <meta property="twitter:title" content="Marrakech Delights - Authentic Moroccan Cuisine">
  <meta property="twitter:description" content="Experience the authentic taste of Morocco with our traditional dishes. Order online for home delivery.">
  <meta property="twitter:image" content="https://marrakech-delights.com/og-image.jpg">

  <!-- Performance and SEO -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0">
  <meta name="theme-color" content="#D4A574">
  <meta name="msapplication-TileColor" content="#D4A574">
  <meta name="msapplication-config" content="browserconfig.xml">

  <title>Marrakech Delights - Authentic Moroccan Cuisine</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Loading indicator styles */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .loading-indicator {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #D4A574;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Remove flutter's default loading indicator */
    #flutter-loader {
      display: none;
    }

    /* Web-specific styles */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #D4A574;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #8B4513;
    }
  </style>
</head>
<body>
  <!-- This script installs service_worker.js to provide PWA functionality.
       It is generated by the Flutter build process. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1787779968');
      });
    }
  </script>

  <!-- Loading indicator -->
  <div class="loading">
    <div class="loading-indicator"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
